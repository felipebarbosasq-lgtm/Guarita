<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="robots" content="noindex">
  <title>Acompanhar pedido</title>
  <link rel="icon" href="/img/logo.jpg">
  <link rel="stylesheet" href="/css/tema.css">
  <style>
    body { background: var(--preto); min-height: 100vh; }
    .topo { color: var(--branco); text-align: center; padding: 28px 16px 70px; }
    .topo img { width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--amarelo); margin: 0 auto 10px; object-fit: cover; }
    .topo h1 { font-size: 15px; color: var(--amarelo); font-weight: 800; }
    .cartao { max-width: 560px; margin: -50px auto 30px; background: var(--branco); border-radius: 20px; padding: 22px 18px; box-shadow: var(--sombra); }
    .cartao + .cartao { margin-top: -14px; }
    .num { font-size: 13px; color: var(--cinza-4); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    .estado { font-size: 26px; font-weight: 900; margin: 4px 0 4px; }
    .sub { color: var(--cinza-6); font-size: 14px; }
    .linha-tempo { list-style: none; padding: 0; margin: 20px 0 6px; }
    .linha-tempo li { display: flex; gap: 12px; align-items: flex-start; padding-bottom: 16px; position: relative; color: var(--cinza-4); font-weight: 600; }
    .linha-tempo li::before { content: ''; width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--cinza-2); background: var(--branco); flex-shrink: 0; z-index: 1; }
    .linha-tempo li:not(:last-child)::after { content: ''; position: absolute; left: 7px; top: 16px; bottom: 0; width: 2px; background: var(--cinza-2); }
    .linha-tempo li.feito { color: var(--preto); }
    .linha-tempo li.feito::before { background: var(--amarelo); border-color: var(--preto); }
    .linha-tempo li.feito::after { background: var(--preto); }
    .linha-tempo small { margin-left: auto; font-weight: 500; }
    .itens div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 14px; border-bottom: 1px solid var(--cinza-1); }
    .itens small { display: block; color: var(--cinza-4); }
    .tot { display: flex; justify-content: space-between; font-weight: 900; font-size: 18px; margin-top: 10px; }
    .acoes { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    .destaque-whats { background: #e9fbf0; border: 1.5px solid #9be3b6; border-radius: 14px; padding: 14px; margin-top: 16px; font-size: 14px; }
    .destaque-whats strong { display: block; font-size: 15px; margin-bottom: 4px; }
  </style>
</head>
<body>
  <header class="topo"><img id="logo" src="/img/logo.jpg" alt=""><h1 id="loja"></h1></header>
  <main id="conteudo"><div class="cartao"><p class="vazio">Carregando pedido…</p></div></main>
  <script src="/js/config.js"></script>
  <script type="module" src="/js/pedido.js"></script>
</body>
</html>
