# Configuração do Render (Blueprint). Cria o serviço web com um disco permanente para o banco de dados.
services:
  - type: web
    name: guarita-mob
    runtime: node
    plan: starter            # o plano gratuito não tem disco permanente: os dados seriam apagados
    region: virginia         # região do Render mais próxima do Brasil
    branch: claude/lucid-brown-ygd7o8
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/saude
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /data
      - key: ALLOW_SIGNUP
        value: "1"           # depois de criar a sua conta, mude para 0 para fechar o cadastro
    disk:
      name: dados
      mountPath: /data
      sizeGB: 1
